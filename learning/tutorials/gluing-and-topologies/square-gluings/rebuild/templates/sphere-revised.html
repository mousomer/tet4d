<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjacent-edge sphere</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111b2a; color: #f6f4ed; }
  body { margin: 0; }
  main { max-width: 960px; margin: auto; padding: clamp(16px,4vw,40px); }
  h1 { font-size: clamp(24px,5vw,38px); margin: 0 0 8px; font-weight: 550; }
  p { margin: 0 0 16px; color: #b6c8da; }
  canvas { display: block; width: 100%; height: clamp(320px,65vh,580px); border: 1px solid #43576e; border-radius: 12px;
           background: radial-gradient(ellipse at 50% 48%, #1b2b40, #111b2a 72%); touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  :focus-visible { outline: 2px solid #64e2e9; outline-offset: 4px; }
  footer { display: flex; gap: 12px 22px; flex-wrap: wrap; align-items: center; margin-top: 15px; }
  button { font: inherit; border: 1px solid #60758e; border-radius: 7px; background: #203047; color: inherit; padding: 7px 12px; cursor: pointer; }
  .a { color: #ffb45c; } .b { color: #64e2e9; }
  .hint { margin-top: 12px; font-size: .9rem; }
</style>
<main>
  <h1>Adjacent-edge sphere</h1>
  <p id="controls">Drag to rotate, or focus the model and use the arrow keys.</p>
  <canvas tabindex="0" aria-describedby="controls angles" aria-label="Rotatable sphere with two seams and three cone vertices"></canvas>
  <footer>
    <button type="button">Reset view</button>
    <span class="a">Seam a · AB / AD</span>
    <span class="b">Seam b · BC / DC</span>
    <label><input type="checkbox" checked> Trace seams through surface</label>
  </footer>
  <p class="hint" id="angles">Cone angles from the square gluing: A and C are 90° each. B + D is 180°.</p>
</main>
<script>
'use strict';
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const reset = document.querySelector('button');
const trace = document.querySelector('input');
const home = { yaw: .24, pitch: .67 };
let {yaw, pitch} = home;
let drag = null;
let pending = false;
const mesh = MESH_DATA;
const {points, faces, seams, tips} = mesh;

function draw() {
  pending = false;
  const {width, height} = canvas.getBoundingClientRect();
  const density = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width*density);
  canvas.height = Math.round(height*density);
  ctx.setTransform(density,0,0,density,0,0);
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const ce = Math.cos(pitch), se = Math.sin(pitch);
  const scale = Math.min(width*.36,height*.56);
  const screen = points.map(([x,y,z]) => {
    const a = ca*x+sa*z, b = -sa*x+ca*z;
    return [width/2+scale*a,height*.51-scale*(ce*y-se*b),se*y+ce*b];
  });
  const sorted = faces.map(([a,b,c,nx,ny,nz]) => {
    const x = ca*nx+sa*nz, z = -sa*nx+ca*nz;
    const diffuse = Math.max(0,-.38*x+.56*(ce*ny-se*z)+.73*(se*ny+ce*z));
    return [a,b,c,(screen[a][2]+screen[b][2]+screen[c][2])/3,diffuse];
  }).sort((a,b)=>a[3]-b[3]);
  function path(indices, close=false) {
    ctx.beginPath();
    indices.forEach((id,i) => {
      const [x,y] = screen[id];
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    if (close) ctx.closePath();
  }
  function seam(ids, color, dashed) {
    ctx.setLineDash(dashed ? [5,5] : []);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    path(ids);
    if (!dashed) {
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#233449';
      ctx.stroke();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = dashed ? 2 : 3.5;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // Faces are depth sorted. Interleave seam segments to hide them behind the mesh.
  const segments = seams.flatMap(([ids,color]) => ids.slice(1).map((id,i) => {
    const prev = ids[i];
    return [[prev,id],color,(screen[prev][2]+screen[id][2])/2+.012];
  })).sort((a,b)=>a[2]-b[2]);
  let next = 0;
  ctx.lineJoin = 'round';
  for (const [a,b,c,depth,light] of sorted) {
    while (next < segments.length && segments[next][2] < depth) {
      const [ids,color] = segments[next++];
      seam(ids,color,false);
    }
    const shade = .46+.68*light;
    const color = 'rgb(' + [122,165,211].map(v=>Math.round(v*shade)).join(',') + ')';
    path([a,b,c],true);
    ctx.fillStyle = ctx.strokeStyle = color;
    ctx.lineWidth = .8;
    ctx.fill();
    ctx.stroke();
  }
  while (next < segments.length) {
    const [ids,color] = segments[next++];
    seam(ids,color,false);
  }
  if (trace.checked) {
    ctx.globalAlpha = .72;
    for (const [ids,color] of seams) seam(ids,color,true);
    ctx.globalAlpha = 1;
  }

  const used = [];
  ctx.font = '14px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const [id,name] of tips) {
    const [x,y] = screen[id];
    const w = ctx.measureText(name).width+18;
    let lx = Math.max(w/2+5,Math.min(width-w/2-5,x+(x-width/2)*.23));
    let ly = Math.max(16,Math.min(height-16,y+(y>height*.51?34:-34)));
    const overlaps = candidate => used.some(([px,py,pw]) =>
      Math.abs(py-candidate)<28 && Math.abs(px-lx)<(pw+w)/2+4);
    ly = [0,30,-30,60,-60,90,-90].map(offset => ly+offset)
      .find(candidate => candidate>=16 && candidate<=height-16 && !overlaps(candidate)) ?? ly;
    used.push([lx,ly,w]);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(lx,ly);
    ctx.strokeStyle = '#d2e1ef';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x,y,3,0,2*Math.PI);
    ctx.fillStyle = '#fff3da';
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(lx-w/2,ly-12,w,24,6);
    ctx.fillStyle = '#172335';
    ctx.fill();
    ctx.strokeStyle = '#687e95';
    ctx.stroke();
    ctx.fillStyle = '#fff3da';
    ctx.fillText(name,lx,ly);
  }
}
function requestDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(draw);
}
function rotate(dx,dy) {
  yaw += dx;
  pitch += dy;
  requestDraw();
}
canvas.addEventListener('pointerdown', event => {
  canvas.setPointerCapture(event.pointerId);
  drag = [event.pointerId,event.clientX,event.clientY];
});
canvas.addEventListener('pointermove', event => {
  if (!drag || drag[0] !== event.pointerId) return;
  rotate((event.clientX-drag[1])*.012,(event.clientY-drag[2])*.012);
  drag = [event.pointerId,event.clientX,event.clientY];
});
canvas.addEventListener('lostpointercapture', () => { drag = null; });
canvas.addEventListener('keydown', event => {
  const delta = {ArrowLeft:[-.13,0],ArrowRight:[.13,0],ArrowUp:[0,-.13],ArrowDown:[0,.13]}[event.key];
  if (!delta) return;
  event.preventDefault();
  rotate(...delta);
});
reset.addEventListener('click', () => { ({yaw,pitch}=home); requestDraw(); });
trace.addEventListener('change', requestDraw);
new ResizeObserver(requestDraw).observe(canvas);
requestDraw();
</script>
