const construction = SURFACES["sphere"];
const sphere = construction.id === 'sphere';

const secondStart = sphere ? 5.25 : 10;
const secondJoin = sphere ? 6.9 : 16;
function onClosure() {

}
const timeline = document.getElementById('timeline');
const play = document.getElementById('play');
const phase = document.getElementById('phase');
const duration = Number(timeline.max);
let seconds = duration;
let started = null;
function seek(value) {

  phase.textContent = seconds < firstJoin ? 'Orange edges approaching' : seconds < secondStart ? 'Orange seam joined'
    : seconds < secondJoin ? 'Cyan edges approaching' : 'Both seams joined';
  if (seconds >= secondJoin && (wasOpen || seconds === duration)) {

function pause() {

}

  play.textContent = 'Pause';

}
play.addEventListener('click', togglePlayback);
timeline.addEventListener('input', () => { pause(); seek(Number(timeline.value)); });
canvas.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlayback(); }
});


function smooth(x) {
  x = Math.max(0, Math.min(1, x));
  return x*x*(3-2*x);
}
function playbackStage(time) {

function stagePoints(stage) {
  const displacement = Number(document.getElementById('separate')?.value || 0) * .006;
  if (stage.closed) {
    return mesh.points.map(([x,y,z,w]) => [x,y,z+(w||0)*displacement]);
  }
  // The adjacent Klein endpoint in this viewer is rotated about z by 0.57.
  const roll = construction.id === 'klein-adjacent' ? .57*stage.view :

function stageSeams(stage) {
  if (stage.closed) return seams;
  const adjacent = sphere || construction.id === 'klein-adjacent';
  const offset = mesh.square.length/2;
  return seams.concat(seams.flatMap(([ids,color],pair) => {
    if (pair===0 && stage.firstClosed) return [];

// Intersect the material grid with the mesh in square coordinates once.
const guideGrid = [];

    const coordinates = ids.map(id=>mesh.square[id][axis]);
    for (let line=-3; line<=3; line++) {

  'direct-curl':[false,true], 'opposite-torus':[false,false],
  'opposite-klein':[false,true], 'opposite-rp2':[true,true],

  function merge(a,b) {
    // The diagonal AC is represented by a vertex in each triangular patch.
    const normalize=id=> {
      if (id===guideCorners[0]+guideOffset || id===guideCorners[2]+guideOffset) return id-guideOffset;

    const ly=Math.max(12,y-16);

function draw(timestamp) {

  canvas.height = Math.round(height*density);

  ctx.textBaseline = 'middle';

    const w = ctx.measureText(name).width+18;
    let lx = Math.max(w/2+5,Math.min(width-w/2-5,x+(x-width/2)*.23));
    let ly = Math.max(16,Math.min(height-16,y+(y>height*.51?34:-34)));
    const overlaps = candidate => used.some(([px,py,pw]) =>
      Math.abs(py-candidate)<28 && Math.abs(px-lx)<(pw+w)/2+4);

    ctx.fillStyle = '#fff3da';
