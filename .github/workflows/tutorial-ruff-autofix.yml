name: Temporary pinned Ruff tutorial formatter

on:
  push:
    branches:
      - docs/learning-interactive-earth-s2-demo-20261118
    paths:
      - .github/workflows/tutorial-ruff-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/learning-interactive-earth-s2-demo-20261118
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Format with repository-pinned Ruff
        run: |
          python -m pip install ruff==0.16.0
          python -m ruff check --fix learning/tutorials
          python -m ruff format learning/tutorials
          python -m ruff check learning/tutorials
          python -m ruff format --check learning/tutorials
      - name: Commit formatting on the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/tutorials
          if ! git diff --cached --quiet; then
            git commit -m "style(tutorials): apply pinned Ruff formatting"
            git push origin HEAD:docs/learning-interactive-earth-s2-demo-20261118
          fi
