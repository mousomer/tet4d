name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  CODEX_MODE: "1"
  TET4D_NATIVE_TOOLS_CI_ADVISORY: "1"

jobs:
  plan:
    name: CI plan / baseline
    runs-on: ubuntu-24.04
    outputs:
      lane_documentation_governance: ${{ steps.select.outputs.lane_documentation_governance }}
      lane_python: ${{ steps.select.outputs.lane_python }}
      lane_godot: ${{ steps.select.outputs.lane_godot }}
      lane_native: ${{ steps.select.outputs.lane_native }}
      lane_deterministic_parity: ${{ steps.select.outputs.lane_deterministic_parity }}
      lane_integration: ${{ steps.select.outputs.lane_integration }}
      lane_packaging: ${{ steps.select.outputs.lane_packaging }}
      lane_platform_macos: ${{ steps.select.outputs.lane_platform_macos }}
      lane_platform_ipados: ${{ steps.select.outputs.lane_platform_ipados }}
      lane_release_acceptance: ${{ steps.select.outputs.lane_release_acceptance }}
      selected_lanes: ${{ steps.select.outputs.selected_lanes }}
      platform_requirements: ${{ steps.select.outputs.platform_requirements }}
      manual_requirements: ${{ steps.select.outputs.manual_requirements }}
      requires_full_repository_gate: ${{ steps.select.outputs.requires_full_repository_gate }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install baseline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Determine changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          mkdir -p state/ci
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            git diff --name-only "$base_sha" "$head_sha" > state/ci/changed_paths.txt
            git diff --check "$base_sha" "$head_sha"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA" \
              > state/ci/changed_paths.txt
            git show --check --format= "$CURRENT_SHA"
          else
            git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA" \
              > state/ci/changed_paths.txt
            git diff --check "$PUSH_BEFORE_SHA" "$CURRENT_SHA"
          fi
          sed -n '1,200p' state/ci/changed_paths.txt

      - name: Classify changed paths
        run: |
          python tools/governance/classify_codex_ci_paths.py \
            state/ci/changed_paths.txt \
            > state/ci/verification_resolution.json
          cat state/ci/verification_resolution.json

      - name: Select CI lanes
        id: select
        run: |
          python tools/governance/select_codex_ci_lanes.py \
            state/ci/verification_resolution.json \
            --github-output "$GITHUB_OUTPUT" \
            > state/ci/lane_selection.json
          cat state/ci/lane_selection.json

      - name: Run always-on repository contracts
        run: |
          scripts/check_git_sanitation.sh
          scripts/check_policy_compliance.sh
          scripts/check_policy_template_drift.sh
          scripts/check_git_sanitation_repo.sh
          scripts/check_policy_compliance_repo.sh
          python -m pytest -q \
            tests/unit/governance/test_classify_codex_ci_paths.py \
            tests/unit/governance/test_select_codex_ci_lanes.py \
            tests/unit/governance/test_platform_ci_routing.py

  documentation-governance:
    name: Documentation / governance
    needs: plan
    if: needs.plan.outputs.lane_documentation_governance == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate documentation and governance
        run: |
          python tools/governance/validate_governance.py
          python tools/governance/generate_configuration_reference.py --check
          python tools/governance/generate_maintenance_docs.py --check
          python -m ruff check tools/governance tests/unit/governance
          python -m ruff format --check tools/governance tests/unit/governance
          python -m pytest -q tests/unit/governance

  checks:
    name: checks (${{ matrix.python-version }})
    needs: plan
    if: needs.plan.outputs.lane_python == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -m ruff --version

      - name: Run canonical Python verification
        run: ./scripts/ci_check.sh

  native:
    name: Native C++ build / tests
    needs: plan
    if: needs.plan.outputs.lane_native == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build and test native core
        run: |
          python tools/codegen/generate_topology_contract.py --check
          ./scripts/build_godot_tet4d_core.sh
          ./scripts/test_godot_tet4d_core.sh

  deterministic-parity:
    name: Deterministic / parity
    needs: plan
    if: needs.plan.outputs.lane_deterministic_parity == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build native parity target
        run: |
          python tools/codegen/generate_topology_contract.py --check
          ./scripts/build_godot_tet4d_core.sh

      - name: Check Python and native parity
        run: |
          PYTHONPATH=src python tools/migration/compare_cpp_gameplay_trace.py \
            --all-plain-2d
          PYTHONPATH=src python tools/migration/compare_cpp_gameplay_trace.py \
            --all-plain-nd
          PYTHONPATH=src python tools/migration/compare_cpp_gameplay_trace.py \
            --all-plain-setup
          python -m pytest -q \
            tests/unit/migration/test_cpp_geometry_parity.py \
            tests/unit/migration/test_cpp_query_parity.py \
            tests/unit/migration/test_cpp_topology_contract_foundation.py

  godot-4-7:
    name: Godot 4.7.2 / native parity
    needs: plan
    if: needs.plan.outputs.lane_godot == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python and native build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Resolve the pinned Godot release
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(
              Path("config/project/policy_pack.json").read_text(encoding="utf-8")
          )
          toolchain = policy["governance"]["godot_toolchain"]
          asset = toolchain["assets"]["linux_x86_64"]
          values = {
              "GODOT_ASSET_NAME": asset["name"],
              "GODOT_ASSET_URL": asset["url"],
              "GODOT_ASSET_SHA256": asset["sha256"],
              "GODOT_ASSET_EXECUTABLE": asset["executable"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Download and verify Godot
        run: |
          mkdir -p "$RUNNER_TEMP/tet4d-godot"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            "$GODOT_ASSET_URL"
          echo "$GODOT_ASSET_SHA256  $RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            -d "$RUNNER_TEMP/tet4d-godot"
          chmod +x "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_EXECUTABLE"
          echo "GODOT_BIN=$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_EXECUTABLE" \
            >> "$GITHUB_ENV"

      - name: Confirm exact engine and binding pins
        run: |
          "$GODOT_BIN" --version
          git -C native/third_party/godot-cpp rev-parse HEAD

      - name: Build and test the native extension
        run: |
          python tools/codegen/generate_topology_contract.py --check
          ./scripts/build_godot_tet4d_core.sh
          ./scripts/test_godot_tet4d_core.sh

      - name: Verify Godot import, scripts, resources, GDExtension, and startup
        run: GODOT_BIN="$GODOT_BIN" ./scripts/verify_godot_4_7.sh

      - name: Confirm verification left the checkout clean
        run: |
          status="$(git status --short --ignore-submodules=untracked)"
          if [[ -n "$status" ]]; then
            echo "$status"
            exit 1
          fi

  packaging:
    name: Packaging contracts
    needs: plan
    if: needs.plan.outputs.lane_packaging == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate packaging contracts
        run: |
          bash -n packaging/godot/build_macos.sh
          bash -n packaging/godot/smoke_macos.sh
          bash -n packaging/scripts/build_linux.sh
          bash -n packaging/scripts/build_macos.sh
          python -m pytest -q \
            tests/unit/boundary/test_godot_release_packaging.py \
            tests/unit/engine/test_windows_packaging.py \
            tests/unit/engine/test_release_metadata.py

  platform-macos:
    name: Platform evidence / Godot game macOS Universal package
    needs: plan
    if: needs.plan.outputs.lane_platform_macos == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Resolve pinned Godot editor and export templates
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          toolchain = json.loads(
              Path("config/project/policy_pack.json").read_text(encoding="utf-8")
          )["governance"]["godot_toolchain"]
          editor = toolchain["assets"]["macos_universal"]
          templates = toolchain["export_templates"]
          values = {
              "GODOT_ASSET_NAME": editor["name"],
              "GODOT_ASSET_URL": editor["url"],
              "GODOT_ASSET_SHA256": editor["sha256"],
              "GODOT_ASSET_EXECUTABLE": editor["executable"],
              "GODOT_TEMPLATE_NAME": templates["name"],
              "GODOT_TEMPLATE_URL": templates["url"],
              "GODOT_TEMPLATE_SHA512": templates["sha512"],
              "GODOT_TEMPLATE_VERSION": templates["version_directory"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Install exact Godot editor and macOS export template
        run: |
          mkdir -p "$RUNNER_TEMP/tet4d-godot"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            "$GODOT_ASSET_URL"
          echo "$GODOT_ASSET_SHA256  $RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            -d "$RUNNER_TEMP/tet4d-godot"
          echo "GODOT_BIN=$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_EXECUTABLE" \
            >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            "$GODOT_TEMPLATE_URL"
          echo "$GODOT_TEMPLATE_SHA512  $RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            | shasum -a 512 --check
          template_dir="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$template_dir"
          unzip -j -o "$RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            templates/macos.zip templates/version.txt -d "$template_dir"

      - name: Build and validate the Godot game macOS Universal package
        run: GODOT_BIN="$GODOT_BIN" packaging/godot/build_macos.sh

  platform-ipados:
    name: Platform evidence / transitional Designer iPadOS export and unsigned simulator final link
    needs: plan
    if: needs.plan.outputs.lane_platform_ipados == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Resolve pinned Godot editor and iOS export template
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          toolchain = json.loads(
              Path("config/project/policy_pack.json").read_text(encoding="utf-8")
          )["governance"]["godot_toolchain"]
          editor = toolchain["assets"]["macos_universal"]
          templates = toolchain["export_templates"]
          values = {
              "GODOT_ASSET_NAME": editor["name"],
              "GODOT_ASSET_URL": editor["url"],
              "GODOT_ASSET_SHA256": editor["sha256"],
              "GODOT_ASSET_EXECUTABLE": editor["executable"],
              "GODOT_TEMPLATE_NAME": templates["name"],
              "GODOT_TEMPLATE_URL": templates["url"],
              "GODOT_TEMPLATE_SHA512": templates["sha512"],
              "GODOT_IOS_MEMBER": templates["ios_member"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Install exact Godot editor and iOS export template
        run: |
          mkdir -p "$RUNNER_TEMP/tet4d-godot" .godot-templates
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            "$GODOT_ASSET_URL"
          echo "$GODOT_ASSET_SHA256  $RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_NAME" \
            -d "$RUNNER_TEMP/tet4d-godot"
          echo "GODOT_BIN=$RUNNER_TEMP/tet4d-godot/$GODOT_ASSET_EXECUTABLE" \
            >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            "$GODOT_TEMPLATE_URL"
          echo "$GODOT_TEMPLATE_SHA512  $RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            | shasum -a 512 --check
          unzip -j -o "$RUNNER_TEMP/tet4d-godot/$GODOT_TEMPLATE_NAME" \
            "$GODOT_IOS_MEMBER" -d .godot-templates
          echo "GODOT_TEMPLATE_ROOT=$GITHUB_WORKSPACE/.godot-templates" \
            >> "$GITHUB_ENV"

      # macOS runners ship full Xcode, so this is the governed release path:
      # arm64 device and x86_64 simulator archives combined with their matching
      # godot-cpp archives, a truthful XCFramework, the exported Xcode project,
      # and an unsigned simulator build through final link. Hosted final link is
      # not physical-device acceptance.
      - name: Build and validate the iPadOS export through Xcode final link
        run: |
          GODOT_BIN="$GODOT_BIN" GODOT_TEMPLATE_ROOT="$GODOT_TEMPLATE_ROOT" \
            packaging/godot/build_ipados.sh

  integration:
    name: Cross-layer integration gate
    needs:
      - plan
      - checks
      - native
      - deterministic-parity
      - godot-4-7
      - packaging
      - platform-macos
      - platform-ipados
    if: always() && needs.plan.outputs.lane_integration == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Confirm selected provider and consumer lanes passed
        env:
          SELECT_PYTHON: ${{ needs.plan.outputs.lane_python }}
          RESULT_PYTHON: ${{ needs.checks.result }}
          SELECT_NATIVE: ${{ needs.plan.outputs.lane_native }}
          RESULT_NATIVE: ${{ needs.native.result }}
          SELECT_PARITY: ${{ needs.plan.outputs.lane_deterministic_parity }}
          RESULT_PARITY: ${{ needs.deterministic-parity.result }}
          SELECT_GODOT: ${{ needs.plan.outputs.lane_godot }}
          RESULT_GODOT: ${{ needs.godot-4-7.result }}
          SELECT_PACKAGING: ${{ needs.plan.outputs.lane_packaging }}
          RESULT_PACKAGING: ${{ needs.packaging.result }}
          SELECT_PLATFORM_MACOS: ${{ needs.plan.outputs.lane_platform_macos }}
          RESULT_PLATFORM_MACOS: ${{ needs.platform-macos.result }}
          SELECT_PLATFORM_IPADOS: ${{ needs.plan.outputs.lane_platform_ipados }}
          RESULT_PLATFORM_IPADOS: ${{ needs.platform-ipados.result }}
        run: |
          selected=0
          check_lane() {
            local selected_value="$1"
            local result_value="$2"
            local label="$3"
            if [[ "$selected_value" != "true" ]]; then
              return
            fi
            selected=$((selected + 1))
            if [[ "$result_value" != "success" ]]; then
              echo "$label was selected but completed as $result_value" >&2
              exit 1
            fi
          }
          check_lane "$SELECT_PYTHON" "$RESULT_PYTHON" "python"
          check_lane "$SELECT_NATIVE" "$RESULT_NATIVE" "native"
          check_lane "$SELECT_PARITY" "$RESULT_PARITY" "deterministic/parity"
          check_lane "$SELECT_GODOT" "$RESULT_GODOT" "godot"
          check_lane "$SELECT_PACKAGING" "$RESULT_PACKAGING" "packaging"
          check_lane "$SELECT_PLATFORM_MACOS" "$RESULT_PLATFORM_MACOS" \
            "platform (macOS)"
          check_lane "$SELECT_PLATFORM_IPADOS" "$RESULT_PLATFORM_IPADOS" \
            "platform (iPadOS)"
          if [[ "$selected" -lt 1 ]]; then
            echo "integration was selected without an implementation evidence lane" >&2
            exit 1
          fi

  release-acceptance:
    name: Release acceptance
    needs:
      - plan
      - documentation-governance
      - checks
      - native
      - deterministic-parity
      - godot-4-7
      - packaging
      - platform-macos
      - platform-ipados
      - integration
    if: always() && needs.plan.outputs.lane_release_acceptance == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate release acceptance evidence
        run: |
          test -s docs/RELEASE_CHECKLIST.md
          test -s docs/RELEASE_INSTALLERS.md
          python tools/governance/generate_configuration_reference.py --check
          python tools/governance/generate_maintenance_docs.py --check
          python -m pytest -q \
            tests/unit/engine/test_windows_packaging.py \
            tests/unit/engine/test_release_metadata.py

  required-gate:
    name: CI required gate
    needs:
      - plan
      - documentation-governance
      - checks
      - native
      - deterministic-parity
      - godot-4-7
      - packaging
      - platform-macos
      - platform-ipados
      - integration
      - release-acceptance
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Confirm every selected lane passed
        env:
          RESULT_PLAN: ${{ needs.plan.result }}
          SELECT_DOCS: ${{ needs.plan.outputs.lane_documentation_governance }}
          RESULT_DOCS: ${{ needs.documentation-governance.result }}
          SELECT_PYTHON: ${{ needs.plan.outputs.lane_python }}
          RESULT_PYTHON: ${{ needs.checks.result }}
          SELECT_NATIVE: ${{ needs.plan.outputs.lane_native }}
          RESULT_NATIVE: ${{ needs.native.result }}
          SELECT_PARITY: ${{ needs.plan.outputs.lane_deterministic_parity }}
          RESULT_PARITY: ${{ needs.deterministic-parity.result }}
          SELECT_GODOT: ${{ needs.plan.outputs.lane_godot }}
          RESULT_GODOT: ${{ needs.godot-4-7.result }}
          SELECT_PACKAGING: ${{ needs.plan.outputs.lane_packaging }}
          RESULT_PACKAGING: ${{ needs.packaging.result }}
          SELECT_PLATFORM_MACOS: ${{ needs.plan.outputs.lane_platform_macos }}
          RESULT_PLATFORM_MACOS: ${{ needs.platform-macos.result }}
          SELECT_PLATFORM_IPADOS: ${{ needs.plan.outputs.lane_platform_ipados }}
          RESULT_PLATFORM_IPADOS: ${{ needs.platform-ipados.result }}
          SELECT_INTEGRATION: ${{ needs.plan.outputs.lane_integration }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          SELECT_RELEASE: ${{ needs.plan.outputs.lane_release_acceptance }}
          RESULT_RELEASE: ${{ needs.release-acceptance.result }}
        run: |
          if [[ "$RESULT_PLAN" != "success" ]]; then
            echo "baseline planning failed: $RESULT_PLAN" >&2
            exit 1
          fi
          check_lane() {
            local selected_value="$1"
            local result_value="$2"
            local label="$3"
            if [[ "$selected_value" == "true" && "$result_value" != "success" ]]; then
              echo "$label was selected but completed as $result_value" >&2
              exit 1
            fi
          }
          check_lane "$SELECT_DOCS" "$RESULT_DOCS" "documentation/governance"
          check_lane "$SELECT_PYTHON" "$RESULT_PYTHON" "python"
          check_lane "$SELECT_NATIVE" "$RESULT_NATIVE" "native"
          check_lane "$SELECT_PARITY" "$RESULT_PARITY" "deterministic/parity"
          check_lane "$SELECT_GODOT" "$RESULT_GODOT" "godot"
          check_lane "$SELECT_PACKAGING" "$RESULT_PACKAGING" "packaging"
          check_lane "$SELECT_PLATFORM_MACOS" "$RESULT_PLATFORM_MACOS" \
            "platform (macOS)"
          check_lane "$SELECT_PLATFORM_IPADOS" "$RESULT_PLATFORM_IPADOS" \
            "platform (iPadOS)"
          check_lane "$SELECT_INTEGRATION" "$RESULT_INTEGRATION" "integration"
          check_lane "$SELECT_RELEASE" "$RESULT_RELEASE" "release acceptance"
          echo "All selected CI lanes passed."
