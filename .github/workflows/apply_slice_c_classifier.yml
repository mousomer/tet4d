name: Apply Slice C classifier boundary

on:
  push:
    branches:
      - codex/path-sensitive-ci-lanes

permissions:
  contents: write

concurrency:
  group: apply-slice-c-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/path-sensitive-ci-lanes
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify offline classification and selection
        run: |
          python tools/governance/generate_configuration_reference.py
          python -m ruff format \
            tools/governance/classify_codex_ci_paths.py \
            tools/governance/select_codex_ci_lanes.py \
            tests/unit/governance/test_classify_codex_ci_paths.py \
            tests/unit/governance/test_select_codex_ci_lanes.py
          python -m ruff check \
            tools/governance/classify_codex_ci_paths.py \
            tools/governance/select_codex_ci_lanes.py \
            tests/unit/governance/test_classify_codex_ci_paths.py \
            tests/unit/governance/test_select_codex_ci_lanes.py
          python -m pytest -q \
            tests/unit/governance/test_classify_codex_ci_paths.py \
            tests/unit/governance/test_select_codex_ci_lanes.py
          git diff --check

      - name: Commit permanent final tree
        run: |
          rm .github/workflows/apply_slice_c_classifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify Codex CI path classification boundary"
          git push origin HEAD:codex/path-sensitive-ci-lanes
