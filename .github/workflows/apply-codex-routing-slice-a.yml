name: Apply Codex routing Slice A

on:
  pull_request:
    branches:
      - master
    paths:
      - tools/automation/apply_codex_routing_slice_a.py
      - .github/workflows/apply-codex-routing-slice-a.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/codex-routing-model
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply routing model and documentation changes
        run: python tools/automation/apply_codex_routing_slice_a.py

      - name: Regenerate policy-backed documentation
        run: |
          python tools/governance/generate_maintenance_docs.py
          python tools/governance/generate_configuration_reference.py

      - name: Format generated Python
        run: |
          python -m ruff format \
            tools/governance/validate_project_contracts.py \
            tests/unit/governance/test_governance_validate_project_contracts.py

      - name: Commit generated draft for bounded refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Codex routing model draft"
          git push origin HEAD:codex/codex-routing-model
