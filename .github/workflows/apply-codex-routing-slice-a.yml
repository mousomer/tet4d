name: Apply Codex routing Slice A

on:
  push:
    branches:
      - codex/codex-routing-model
    paths:
      - tools/automation/apply_codex_routing_slice_a.py
      - .github/workflows/apply-codex-routing-slice-a.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/codex-routing-model
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply routing model and documentation changes
        run: python tools/automation/apply_codex_routing_slice_a.py

      - name: Regenerate policy-backed documentation
        run: |
          python tools/governance/generate_maintenance_docs.py
          python tools/governance/generate_configuration_reference.py

      - name: Format and lint changed Python
        run: |
          python -m ruff format \
            tools/governance/validate_project_contracts.py \
            tests/unit/governance/test_governance_validate_project_contracts.py
          python -m ruff check --fix \
            tools/governance/validate_project_contracts.py \
            tests/unit/governance/test_governance_validate_project_contracts.py

      - name: Run focused governance verification
        run: |
          python tools/governance/validate_project_contracts.py
          python tools/governance/generate_maintenance_docs.py --check
          python tools/governance/generate_configuration_reference.py --check
          python -m pytest -q \
            tests/unit/governance/test_governance_validate_project_contracts.py
          git diff --check

      - name: Remove temporary applicator
        run: |
          rm tools/automation/apply_codex_routing_slice_a.py
          rm .github/workflows/apply-codex-routing-slice-a.yml

      - name: Commit Slice A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add machine-readable Codex routing model"
          git push origin HEAD:codex/codex-routing-model

# Trigger after workflow registration.
