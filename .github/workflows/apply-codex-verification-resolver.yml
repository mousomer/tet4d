name: Apply Codex verification resolver

on:
  pull_request:
    branches:
      - master
    paths:
      - tools/automation/apply_codex_verification_resolver.py
      - .github/workflows/apply-codex-verification-resolver.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/codex-verification-resolver
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply resolver implementation
        run: python tools/automation/apply_codex_verification_resolver.py

      - name: Remove temporary machinery before measuring final tree
        run: |
          rm tools/automation/apply_codex_verification_resolver.py
          rm .github/workflows/apply-codex-verification-resolver.yml

      - name: Format and lint resolver
        run: |
          python -m ruff format \
            tools/governance/resolve_codex_verification.py \
            tests/unit/governance/test_resolve_codex_verification.py
          python -m ruff check \
            tools/governance/resolve_codex_verification.py \
            tests/unit/governance/test_resolve_codex_verification.py

      - name: Regenerate policy-backed documentation
        run: |
          python tools/governance/generate_configuration_reference.py
          python tools/governance/generate_maintenance_docs.py

      - name: Run focused Slice B verification
        run: |
          python tools/governance/validate_project_contracts.py
          python tools/governance/generate_configuration_reference.py --check
          python tools/governance/generate_maintenance_docs.py --check
          python -m pytest -q \
            tests/unit/governance/test_resolve_codex_verification.py \
            tests/unit/governance/test_governance_validate_project_contracts.py
          git diff --check

      - name: Commit validated Slice B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Codex verification resolver"
          git push origin HEAD:codex/codex-verification-resolver
