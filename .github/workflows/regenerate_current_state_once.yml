name: Regenerate CURRENT_STATE once

# One registration follow-up triggers this temporary PR workflow.
on:
  pull_request:
    paths:
      - .github/workflows/regenerate_current_state_once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'codex/path-sensitive-ci-lanes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/path-sensitive-ci-lanes
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Regenerate maintenance state
        run: |
          python tools/governance/generate_maintenance_docs.py
          rm .github/workflows/regenerate_current_state_once.yml
          git diff --check
          python tools/governance/generate_maintenance_docs.py --check

      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md .github/workflows/regenerate_current_state_once.yml
          git commit -m "Regenerate current project state"
          git push origin HEAD:codex/path-sensitive-ci-lanes
