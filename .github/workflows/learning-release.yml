name: Learning release

# The learning branch's CD: a learning-vN tag publishes the offline edition (learning/released) as a
# zip on a GitHub release. It verifies the edition first; it never builds or packages the game.
on:
  push:
    tags:
      - "learning-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing learning-vN tag to publish (for tags pushed before this workflow existed)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: learning-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the offline edition
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Require a learning tag on the learning branch
        run: |
          [[ "$TAG" =~ ^learning-v[0-9]+(\.[0-9]+)*$ ]] || { echo "not a learning-vN tag: $TAG" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/learning || {
            echo "$TAG is not on the learning branch" >&2; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the learning tools
        run: |
          python -m pip install -r learning/ci/requirements.txt
          python -m playwright install --with-deps chromium
          echo "$(python -c 'import pypandoc, pathlib; print(pathlib.Path(pypandoc.get_pandoc_path()).parent)')" >> "$GITHUB_PATH"
      - name: Verify the offline edition
        run: python learning/gate.py --full --any-branch --base HEAD
      - name: Package the offline edition
        run: |
          mkdir -p dist
          (cd learning && zip -qr "../dist/tet4d-learning-$TAG.zip" released)
          (cd dist && sha256sum "tet4d-learning-$TAG.zip" > "tet4d-learning-$TAG.zip.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: tet4d-learning-${{ env.TAG }}
          path: dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest=false: the repository's Latest release stays the game's.
          gh release create "$TAG" dist/* --verify-tag --notes-from-tag --latest=false \
            --title "Tet4D learning material $TAG"
